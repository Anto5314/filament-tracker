name: "🖨️ Imprimante non compatible / n'apparaît pas"
description: "Signaler une imprimante Creality que Filament Tracker ne détecte pas ou avec laquelle l'application ne fonctionne pas."
title: "Compatibilité : [Modèle] — [problème résumé]"
labels: ["compatibilité"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de remplir ce rapport ! 🎯 Cela nous aide à étendre la compatibilité à plus d'imprimantes.

  - type: input
    id: printer_model
    attributes:
      label: "🖨️ Modèle exact de l'imprimante"
      description: "Ex. K1 Max, K2 Plus, Ender-3 V3 KE…"
      placeholder: "K1 Max"
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: "🔧 Version du firmware"
      description: "Visible sur l'écran de l'imprimante (menu À propos). Ex. DWIN CR4CU220812S11 1.3.5.22"
      placeholder: "DWIN …"
    validations:
      required: true

  - type: textarea
    id: symptom
    attributes:
      label: "📋 Symptôme"
      description: "Que se passe-t-il ? L'appli ne se connecte pas ? Les fichiers ne s'affichent pas ? Une erreur ?"
      placeholder: "Le dashboard affiche « Hors ligne » alors que l'imprimante est allumée…"
    validations:
      required: true

  - type: textarea
    id: ports
    attributes:
      label: "🌐 Vérification des ports (à faire avant de poster)"
      description: |
        Depuis un PC sur le même réseau, vérifiez ces 2 choses et copiez les résultats :
        1. `nc -vz <IP-imprimante> 9999` (WebSocket)
        2. `curl -s -o /dev/null -w "%{http_code}" http://<IP-imprimante>/downloads/humbnail/test.png` (doit répondre, même une 404)
      placeholder: "Port 9999 : ouvert\nMiniatures : HTTP 404 (donc serveur OK)"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "🧾 Logs du collecteur (optionnel mais précieux)"
      description: |
        Si possible : `docker logs <nom-conteneur-collector>` — les lignes pendant l'échec de connexion.
      placeholder: "…"

  - type: checkboxes
    id: checks
    attributes:
      label: "✅ Vérifications"
      options:
        - label: "J'ai lu la section « Compatibilité » du README"
          required: true
        - label: "Mon imprimante est sur le même réseau que le serveur"
          required: true
        - label: "Les ports 9999 et 80 sont accessibles depuis le serveur (test ci-dessus)"
          required: true